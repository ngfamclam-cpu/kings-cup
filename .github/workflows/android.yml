# Wraps www/ in an Android app with Capacitor and builds an APK.
# Every push: the APK is attached to the workflow run (Actions tab -> run -> Artifacts).
# Pushing a tag like v0.1.0: the APK is also published as a GitHub Release, which the
# README's "latest" download link points to.
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      # The android/ project is generated fresh each build rather than committed.
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kings-cup.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kings-cup-apk
          path: kings-cup.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kings-cup.apk
          generate_release_notes: true
